<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="feudBlue" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#172554;stop-opacity:1" />
    </radialGradient>
    
    <filter id="hardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feFlood flood-color="#000" flood-opacity="0.8"/>
      <feComposite operator="in" in2="SourceGraphic"/>
      <feOffset dx="3" dy="3"/>
      <feComposite operator="over" in="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="100" height="100" rx="20" fill="url(#feudBlue)"/>
  
  <ellipse cx="50" cy="52" rx="42" ry="32" fill="none" stroke="#fbbf24" stroke-width="5"/>
  <ellipse cx="50" cy="52" rx="42" ry="32" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.5"/>

  <text x="50" y="70" 
        font-family="Georgia, 'Times New Roman', serif" 
        font-size="55" 
        font-weight="900" 
        fill="#ffffff" 
        text-anchor="middle" 
        filter="url(#hardShadow)"
        letter-spacing="-2">FF</text>
</svg>